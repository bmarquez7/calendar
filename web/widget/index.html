<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Tirana Events Calendar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../shared/styles.css" />
  </head>
  <body class="widget-page">
    <div class="app widget-app">
      <section class="hero widget-hero">
        <div class="hero-top">
          <div class="language-switcher">
            <button type="button" class="secondary" id="language-button">Language</button>
            <div id="language-menu" class="language-menu hidden"></div>
          </div>
          <div class="hero-actions">
            <a class="button-link" id="submit-events-link" href="/widget/submit/">Submit events</a>
            <a class="button-link secondary-link" id="admin-signin-link" href="/admin/">Admin sign on</a>
          </div>
        </div>
        <h1 id="hero-title">Tirana Events Calendar</h1>
        <p id="hero-subtitle">
          Discover culture, community, and nightlife across Tirana. Filter by area, type, language, date, and price.
        </p>
        <div class="mobile-filter-bar" id="mobile-filter-bar">
          <div id="mobile-search-slot" class="mobile-search-slot"></div>
          <button
            type="button"
            class="secondary"
            id="mobile-filters-button"
            aria-expanded="false"
            aria-controls="mobile-filter-panel"
          >
            Filters
          </button>
        </div>
        <div id="mobile-filter-panel" class="mobile-filter-panel hidden">
          <div id="mobile-filter-controls" class="mobile-filter-controls"></div>
        </div>
        <div class="controls" id="filter-controls"></div>
        <div class="featured-box">
          <h3 id="featured-title">Highlighted Events</h3>
          <div id="featured-grid" class="featured-grid"></div>
        </div>
      </section>

      <section class="widget-calendar-section">
        <div class="admin-bar widget-summary-bar" style="margin-bottom: 12px;">
          <span class="badge" id="results-count">0 events</span>
          <button class="secondary" id="reset-filters">Reset filters</button>
        </div>
        <div class="admin-bar widget-view-bar" id="view-controls" style="margin-bottom: 12px;">
          <button class="secondary toggle-button" data-view="month">Month</button>
          <button class="secondary toggle-button" data-view="week">Week</button>
          <button class="secondary toggle-button" data-view="list">List</button>
        </div>
        <div id="calendar-view"></div>
        <div class="cards" id="event-list"></div>
      </section>
    </div>
    <div id="event-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-backdrop" data-close-modal="true"></div>
      <div class="modal-content">
        <button type="button" class="modal-close secondary" id="modal-close">Close</button>
        <div id="modal-body"></div>
      </div>
    </div>

    <script type="module" src="../shared/vendor.js"></script>
    <script type="module" src="./widget.js"></script>
    <script src="../shared/embed-resize.js"></script>
  </body>
</html>
